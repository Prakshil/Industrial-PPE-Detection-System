name: PPE Detection — CI Pipeline

on:
  pull_request:
    branches: [ "main", "master" ]
  push:
    branches: [ "main", "master" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check code formatting with Black
      run: |
        black --check ppe_monitor/ tests/ --line-length 100

    - name: Check import sorting with isort
      run: |
        isort --check-only ppe_monitor/ tests/ --profile black

    - name: Lint with flake8
      run: |
        # Stop on Python syntax errors or undefined names
        flake8 ppe_monitor/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Treat style warnings as non-blocking
        flake8 ppe_monitor/ tests/ --count --exit-zero --max-complexity=12 --max-line-length=100 --statistics

    - name: Run unit tests
      run: |
        pytest tests/ -v --tb=short

  validate-yaml-configs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - run: pip install pyyaml
    - name: Validate all YAML configs
      run: |
        python -c "
        import yaml, glob, sys
        errors = []
        for f in glob.glob('ppe_monitor/config/*.yaml'):
            try:
                yaml.safe_load(open(f))
                print(f'  OK: {f}')
            except Exception as e:
                errors.append(f'{f}: {e}')
        if errors:
            for e in errors: print(f'  FAIL: {e}')
            sys.exit(1)
        print(f'All YAML configs valid.')
        "
