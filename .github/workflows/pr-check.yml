name: PPE Detection — CI Pipeline

on:
  pull_request:
    branches: [ "main", "master" ]
  push:
    branches: [ "main", "master" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install lint and test tools
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8 pytest pyyaml

    - name: Check code formatting with Black
      run: |
        black --check ppe_monitor/ tests/ scripts/ --line-length 100

    - name: Check import sorting with isort
      run: |
        isort --check-only ppe_monitor/ tests/ scripts/ --profile black

    - name: Lint with flake8
      run: |
        # Stop on Python syntax errors or undefined names
        flake8 ppe_monitor/ tests/ scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Treat style warnings as non-blocking
        flake8 ppe_monitor/ tests/ scripts/ --count --exit-zero --max-complexity=12 --max-line-length=100 --statistics

    - name: Run unit tests
      run: |
        pytest tests/ -v --tb=short

  validate-yaml-configs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - run: pip install pyyaml
    - name: Validate all YAML files
      run: |
        python -c "
        import yaml, glob, sys
        files = sorted(glob.glob('**/*.yml', recursive=True) + glob.glob('**/*.yaml', recursive=True))
        files = [f for f in files if not f.replace(chr(92), '/').startswith('.git/')]
        if not files:
            print('No YAML files found to validate.')
            sys.exit(0)
        errors = []
        for f in files:
            try:
                yaml.safe_load(open(f, encoding='utf-8'))
                print(f'  OK: {f}')
            except Exception as e:
                errors.append(f'{f}: {e}')
        if errors:
            for e in errors:
                print(f'  FAIL: {e}')
            sys.exit(1)
        print(f'All {len(files)} YAML files valid.')
        "
